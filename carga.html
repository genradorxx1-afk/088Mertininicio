<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%;overflow:hidden}body{font-family:"Inter",sans-serif;background:linear-gradient(135deg,#0A1E4D 0%,#0D3B7D 25%,#0D52A8 50%,#1B7FD4 75%,#0A2463 100%);background-size:400% 400%;animation:gradientShift 15s ease infinite;display:flex;justify-content:center;align-items:center;min-height:100vh;position:relative;overflow:hidden}@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}.bg-elements{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;overflow:hidden}.floating-orb{position:absolute;border-radius:50%;opacity:0.1;filter:blur(40px)}.orb-1{width:300px;height:300px;background:radial-gradient(circle at 30% 30%,#FF8D42,#F57820);top:-100px;right:-100px;animation:float 20s ease-in-out infinite}.orb-2{width:250px;height:250px;background:radial-gradient(circle at 30% 30%,#4DAAFF,#1B7FD4);bottom:-80px;left:-80px;animation:float 25s ease-in-out infinite reverse}.orb-3{width:200px;height:200px;background:radial-gradient(circle at 30% 30%,#FF8D42,#FFB366);bottom:20%;right:10%;animation:float 30s ease-in-out infinite}@keyframes float{0%,100%{transform:translate(0,0)}25%{transform:translate(-30px,-30px)}50%{transform:translate(30px,30px)}75%{transform:translate(-20px,20px)}}.grid-background{position:absolute;width:100%;height:100%;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite}@keyframes gridMove{0%{background-position:0 0}100%{background-position:50px 50px}}.container{position:relative;z-index:10;width:100%;max-width:500px;padding:20px;display:flex;flex-direction:column;align-items:center}.card-container{background:rgba(255,255,255,0.92);backdrop-filter:blur(30px);border-radius:32px;padding:80px 60px;box-shadow:0 40px 80px rgba(0,0,0,0.2),0 0 40px rgba(27,127,212,0.15),0 0 1px rgba(255,255,255,0.8) inset;border:1px solid rgba(255,255,255,0.5);animation:cardEntrance 0.8s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}@keyframes cardEntrance{from{opacity:0;transform:translateY(40px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}.card-top-accent{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#FF8D42,#FFB366,transparent);box-shadow:0 0 20px rgba(255,141,66,0.4)}.card-corner-dots{position:absolute;width:20px;height:20px;top:20px;right:20px}.dot{width:4px;height:4px;background:#1B7FD4;border-radius:50%;position:absolute;animation:dotPulse 2s ease-in-out infinite}.dot:nth-child(1){top:0;left:0;animation-delay:0s}.dot:nth-child(2){top:0;right:0;animation-delay:0.2s}.dot:nth-child(3){bottom:0;right:0;animation-delay:0.4s}@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.3}50%{transform:scale(1.5);opacity:1}}.spinner-section{position:relative;width:180px;height:180px;margin:0 auto 40px;display:flex;justify-content:center;align-items:center}.advanced-spinner{position:relative;width:100%;height:100%}.spinner-ring{position:absolute;width:100%;height:100%;border-radius:50%;box-shadow:inset 0 0 40px rgba(0,0,0,0.05)}.ring-1{border:3px solid transparent;border-top-color:#1B7FD4;border-right-color:rgba(27,127,212,0.3);animation:spin1 3s cubic-bezier(0.68,-0.55,0.265,1.55) infinite;box-shadow:0 0 30px rgba(27,127,212,0.4)}.ring-2{border:3px solid transparent;border-bottom-color:#FF8D42;border-left-color:rgba(255,141,66,0.3);animation:spin2 3.5s cubic-bezier(0.68,-0.55,0.265,1.55) infinite;width:85%;height:85%;top:7.5%;left:7.5%;box-shadow:0 0 25px rgba(255,141,66,0.3)}.ring-3{border:2px solid transparent;border-top-color:rgba(77,170,255,0.5);border-right-color:rgba(77,170,255,0.1);animation:spin3 4s linear infinite;width:65%;height:65%;top:17.5%;left:17.5%;opacity:0.8}.ring-4{border:1px solid transparent;border-bottom-color:rgba(255,141,66,0.4);animation:spin1 2.5s cubic-bezier(0.68,-0.55,0.265,1.55) infinite;width:45%;height:45%;top:27.5%;left:27.5%;opacity:0.6}@keyframes spin1{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes spin2{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}@keyframes spin3{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}.logo-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5}.logo-badge{width:80px;height:80px;background:linear-gradient(135deg,#0D52A8 0%,#1B7FD4 100%);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(27,127,212,0.4),inset 0 2px 8px rgba(255,255,255,0.2),0 0 40px rgba(27,127,212,0.2);border:2px solid rgba(255,255,255,0.3);animation:logoGlow 3s ease-in-out infinite}@keyframes logoGlow{0%,100%{box-shadow:0 20px 50px rgba(27,127,212,0.4),inset 0 2px 8px rgba(255,255,255,0.2),0 0 40px rgba(27,127,212,0.2)}50%{box-shadow:0 20px 50px rgba(27,127,212,0.5),inset 0 2px 8px rgba(255,255,255,0.3),0 0 60px rgba(27,127,212,0.35)}}.logo-badge img{width:75%;height:75%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.15));clip-path:circle(50%)}.content-section{text-align:center;margin-top:20px}.main-title{font-family:"Poppins",sans-serif;font-size:24px;font-weight:700;color:#0A2463;letter-spacing:-0.5px;margin-bottom:12px;animation:titleFadeIn 0.8s ease 0.2s both}@keyframes titleFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.subtitle{font-size:14px;color:#555555;font-weight:400;line-height:1.6;letter-spacing:0.3px;margin-top:12px;animation:subtitleFadeIn 0.8s ease 0.3s both}@keyframes subtitleFadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}.loading-dots{display:inline-block}.dot-loader{display:inline-block;width:4px;height:4px;background-color:#1B7FD4;border-radius:50%;margin:0 3px;animation:dotBounce 1.4s infinite}.dot-loader:nth-child(2){animation-delay:0.2s}.dot-loader:nth-child(3){animati
