<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}body{display:flex;justify-content:center;align-items:center;font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0a1428 0%,#0d1e3c 100%);overflow:hidden}.container{text-align:center;max-width:420px;width:100%;padding:20px}.card{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:48px 40px;box-shadow:0 10px 40px rgba(0,0,0,0.3);animation:slideUp 0.7s cubic-bezier(0.34,1.56,0.64,1)}.logo-wrapper{margin-bottom:32px}.logo{width:72px;height:72px;margin:0 auto;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.05));border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;animation:fadeInScale 0.8s ease-out 0.1s both;box-shadow:0 8px 24px rgba(0,0,0,0.2)}.logo img{width:100%;height:100%;object-fit:cover}.loader{margin-bottom:32px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;position:relative}.loader::after{content:"";position:absolute;left:0;top:0;height:100%;width:30%;background:linear-gradient(90deg,rgba(59,130,246,0) 0%,rgba(59,130,246,0.8) 50%,rgba(59,130,246,0) 100%);animation:loading 1.8s ease-in-out infinite}.status-text{font-size:15px;color:rgba(255,255,255,0.85);font-weight:500;letter-spacing:0.2px;margin-bottom:8px;animation:fadeIn 0.8s ease-out 0.2s both}.status-dots{display:inline-block;width:4px;animation:dots 1.4s steps(4,end) infinite}.security-info{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.6);animation:fadeIn 0.8s ease-out 0.4s both}.security-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center}.lock-icon::before{content:"";position:absolute
